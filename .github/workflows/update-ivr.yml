name: Atualizar dados do Brasil na Vida Real
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "brasil-na-vida-real/scripts/update_data.py"
      - ".github/workflows/update-ivr.yml"
      - "brasil-na-vida-real/data/indicadores.json"
permissions:
  contents: write
concurrency:
  group: atualizar-ivr
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Node para validar JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar JavaScript incorporado na página
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("brasil-na-vida-real/index.html").read_text(encoding="utf-8")
          if "<script>" not in page or "</script>" not in page:
              raise SystemExit("Bloco JavaScript não encontrado na página.")
          markup = page.split("<script>", 1)[0]
          if r"\n" in markup:
              raise SystemExit("Texto literal \\n encontrado no HTML fora do JavaScript.")
          required = ["spendFood", "spendFuel", "spendHousing", "spendDebt", "monthlyBenefit", "spendTargetProducts"]
          missing = [item for item in required if item not in page]
          if missing:
              raise SystemExit("Campos de orçamento ausentes: " + ", ".join(missing))
          script = page.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/ivr-inline.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/ivr-inline.js
      - name: Instalar leitor de planilhas da ANP
        run: python -m pip install --disable-pip-version-check openpyxl requests
      - name: Coletar fontes oficiais e notícias
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python brasil-na-vida-real/scripts/update_data.py
      - name: Registrar atualização de dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brasil-na-vida-real/data/indicadores.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
            exit 0
          fi
          git commit -m "Atualizar dados públicos do IVR"
          # Keep a refresh from losing a concurrent website or workflow change.
          git fetch origin main
          git rebase origin/main
          git push
