name: Enriquecer contas bancarias de emendas
on:
  push:
    branches: [main]
    paths:
      - 'emendas-parlamentares/enriquecer_contas.py'
      - '.github/workflows/enriquecer-contas.yml'
  workflow_dispatch:
  schedule:
    - cron: '55 10 * * *'
permissions:
  contents: write
concurrency:
  group: enriquecer-contas-emendas
  cancel-in-progress: false
jobs:
  contas:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar contas públicas e cruzar com registros da CGU
        run: python emendas-parlamentares/enriquecer_contas.py
      - name: Publicar somente contas validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emendas-parlamentares/dados-contas.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza contas vinculadas a emendas federais em SBC"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
