name: Verificar fontes de paineis de emendas SP
on:
  push:
    branches: [main]
    paths:
      - emendas-parlamentares/inspecionar_paineis.py
      - .github/workflows/inspecionar-paineis-sp.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u emendas-parlamentares/inspecionar_paineis.py
