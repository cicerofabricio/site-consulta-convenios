name: Atualizar Fundo a Fundo
on:
  workflow_dispatch:
  schedule:
    - cron: '25 9 * * *'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar API oficial e validar resposta
        run: python fundo-a-fundo/atualizar.py
      - name: Publicar dados somente quando válidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundo-a-fundo/dados.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados fundo a fundo de São Bernardo do Campo"
            git push
          fi
