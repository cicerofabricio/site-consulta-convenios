name: Diagnosticar CSV de emendas estaduais
on:
  push:
    branches: [main]
    paths:
      - 'emendas-parlamentares/diagnosticar_sp.py'
      - '.github/workflows/diagnosticar-emendas-sp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecionar pagina publica de emendas
        run: python -u emendas-parlamentares/diagnosticar_sp.py
