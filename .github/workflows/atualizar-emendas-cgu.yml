name: Atualizar emendas federais - CGU
on:
  push:
    branches: [main]
    paths:
      - 'emendas-parlamentares/atualizar_cgu.py'
      - '.github/workflows/atualizar-emendas-cgu.yml'
  workflow_dispatch:
  schedule:
    - cron: '40 10 * * *'
permissions:
  contents: write
concurrency:
  group: atualizar-emendas-cgu
  cancel-in-progress: false
jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Baixar e cruzar bases oficiais da CGU
        run: python emendas-parlamentares/atualizar_cgu.py
      - name: Publicar somente quando a coleta for válida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emendas-parlamentares/dados-cgu.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza emendas CGU para Sao Bernardo do Campo"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
