name: Diagnosticar fontes bancarias para emendas
on:
  push:
    branches: [main]
    paths:
      - 'emendas-parlamentares/diagnosticar_contas.py'
      - '.github/workflows/diagnosticar-contas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python emendas-parlamentares/diagnosticar_contas.py
